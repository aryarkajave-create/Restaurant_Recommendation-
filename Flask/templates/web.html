<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inference Engine - Essenza Dining</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Outfit', sans-serif; background-color: #F9F7F2; color: #1A1A1A; overflow-x: hidden; }

* { transition: all 0.25s ease; }

.input-glow:focus {
    box-shadow: 0 0 50px rgba(197, 160, 89, 0.2);
    border-color: #C5A059;
}

.btn-premium {
    position: relative;
    overflow: hidden;
}
.btn-premium::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
}
.btn-premium:hover::before { transform: translateX(100%); transition: 0.8s; }

.float { animation: floatAnim 6s ease-in-out infinite; }
@keyframes floatAnim {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.food-img:hover { transform: scale(1.08) rotate(1deg); z-index: 50; }

.glass {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 0, 0, 0.05);
}

#loader {
    position: fixed;
    inset: 0;
    background: rgba(249, 247, 242, 0.9);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
}
#loader.active { opacity: 1; pointer-events: all; }

.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(0,0,0,0.05);
    border-top: 4px solid #C5A059;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body class="min-h-screen flex flex-col">

<div id="loader">
    <div class="flex flex-col items-center gap-6">
        <div class="spinner"></div>
        <p class="text-sm tracking-widest uppercase text-gray-500">Finding perfect matches...</p>
    </div>
</div>

<nav class="px-8 py-8 flex justify-between items-center max-w-7xl mx-auto w-full">
    <a href="/" class="text-2xl font-extrabold text-black flex items-center gap-3 group">
        <span class="text-3xl font-extrabold tracking-tighter text-black">
            Essenza <span class="text-[#C5A059]">Dining</span>
        </span>
    </a>
    <div class="flex gap-8">
        <a href="/" class="text-sm text-gray-500 hover:text-black uppercase tracking-widest">Home</a>
        <a href="/web" class="text-sm text-[#C5A059] border-b-2 border-[#C5A059] pb-1 uppercase tracking-widest">Inference</a>
    </div>
</nav>

<main class="flex-grow flex lg:flex-row flex-col items-center relative">
    <div class="hidden lg:flex w-1/2 h-full absolute inset-y-0 left-[6%]">
        <div class="relative w-full h-full">
            <img src="https://images.unsplash.com/photo-1551782450-a2132b4ba21d" class="food-img absolute top-[20%] left-[20%] w-[55%] h-[55%] object-cover rounded-[2rem] float">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" class="food-img absolute top-0 left-20 w-48 h-48 rounded-2xl rotate-[-10deg] float">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" class="food-img absolute top-10 right-10 w-56 h-56 rounded-2xl rotate-[12deg] float">
        </div>
    </div>

    <div class="w-full lg:w-1/2 lg:ml-auto px-6 lg:px-20 py-12 z-10 max-w-xl">
        <h1 class="text-5xl font-extrabold mb-6 text-black">Find restaurants <br> you’ll love.</h1>
        <p class="text-gray-500 mb-10">Discover your next favorite place using intelligent recommendations.</p>

        <form action="/result" method="POST" autocomplete="off" id="search-form">
            <div class="relative mb-6">
                <input type="text" name="output" id="output" placeholder="Search restaurant..." 
                       class="input-glow w-full px-6 py-6 bg-white border border-black/5 rounded-2xl text-lg text-black focus:scale-[1.02] shadow-sm">
                <div id="suggestions" class="hidden absolute w-full z-50 mt-3 glass rounded-2xl shadow-xl"></div>
            </div>
            <button type="submit" class="btn-premium w-full py-5 bg-black text-white rounded-2xl hover:bg-gray-800 hover:scale-[1.03] active:scale-95 font-bold uppercase tracking-widest shadow-xl">
                Show Recommendations
            </button>
        </form>
    </div>
</main>

<script>
const inputField = document.getElementById('output');
const suggestionsBox = document.getElementById('suggestions');
const form = document.getElementById('search-form');
const loader = document.getElementById('loader');

form.addEventListener('submit', () => { loader.classList.add('active'); });

inputField.addEventListener('input', async function() {
    const val = this.value;
    if (!val) return suggestionsBox.classList.add('hidden');
    const res = await fetch(`/autocomplete?term=${val}`);
    const data = await res.json();
    suggestionsBox.innerHTML = "";
    suggestionsBox.classList.remove('hidden');
    data.forEach(item => {
        let div = document.createElement("div");
        div.innerHTML = item;
        div.className = "px-6 py-4 cursor-pointer hover:bg-[#C5A059]/10 text-black rounded-xl";
        div.onclick = () => { inputField.value = item; suggestionsBox.innerHTML = ""; };
        suggestionsBox.appendChild(div);
    });
});
</script>
</div>
</body>
</html>
